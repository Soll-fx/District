# Render Blueprint — District API
# Стабильный URL: https://district-api.onrender.com (не ротируется при деплоях)
services:
  - type: web
    name: district-api
    runtime: docker
    repo: https://github.com/Soll-fx/District
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://district-wccn-beta.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SYNC_KEY
        sync: false
