# Render Blueprint — Sollo API (репозиторий пока называется District)
# Основной домен фронтенда: https://sollo.eu.org (после делегирования eu.org)
# Запасной адрес: https://district-wccn-beta.vercel.app
services:
  - type: web
    name: district-api
    runtime: docker
    repo: https://github.com/Soll-fx/District
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://sollo.eu.org,https://www.sollo.eu.org,https://district-wccn-beta.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SYNC_KEY
        sync: false
